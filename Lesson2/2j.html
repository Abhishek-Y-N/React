<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 2j</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

		function ProductDetails({pname,price,discount,imgSrc}){
			return(
				<>
					<img src={imgSrc} width="100"/>
					<p>{pname}</p>
					{discount? <del>Price:{price}</del> : <p>Price:{price}</p>}
					{discount && <p>Discount Price={discount}</p>}
					<button>Add to Cart</button>
				</>
			);
		}

		function App(){
			return(
				<>
					<ProductDetails pname="Cotton Socks" price="$10.90" discount="$5.45" imgSrc="cotton-socks.png"/>
					<ProductDetails pname="Tennis Balls" price="$6.00" imgSrc="tennis-balls.png" />
					<ProductDetails pname="Plain T-Shirts" price="$7.99" imgSrc="plain-t-shirt.png"/>
				</>
			);
		}


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
