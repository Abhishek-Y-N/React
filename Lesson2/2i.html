<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 2i</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

		function ProductDetails({pname,price,discount}){
			return(
				<>
					<p>{pname}</p>
					{discount? <del>Price:{price}</del> : <p>Price:{price}</p>}
					{discount && <p>Discount Price={discount}</p>}
					<button>Add to Cart</button>
				</>
			);
		}

		function App(){
			return(
				<>
					<ProductDetails pname="Cotton Socks" price="$10.90" discount="$5.45"/>
					<ProductDetails pname="Tennis Balls" price="$6.00" />
					<ProductDetails pname="Plain T-Shirts" price="$7.99"/>
				</>
			);
		}


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App/>);
    </script>
  </body>
</html>
